{{template "layout.html" .}}

{{define "title"}}Reset Password &bull; Series Taekwondo Management System{{end}}

{{define "content"}}
<div class="max-w-md mx-auto my-8 sm:my-12">
    <!-- Brand / Header -->
    <div class="text-center mb-6">
        <div class="inline-flex h-16 w-16 rounded-2xl bg-gradient-to-tr from-[#990303] to-[#7D0202] items-center justify-center font-display font-black text-white text-3xl shadow-xl shadow-[#990303]/30 mb-4 border border-red-500/30">
            ST
        </div>
        <h1 class="font-display font-extrabold text-2xl sm:text-3xl tracking-wide uppercase text-black dark:text-[#FFFDF4]">
            SET NEW <span class="text-[#990303]">PASSWORD</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mt-1 font-medium">
            Please enter and confirm your new account password
        </p>
    </div>

    <!-- Error Alert -->
    {{if .Error}}
    <div class="mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs sm:text-sm flex items-center gap-3 animate-fade-in shadow-sm">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="font-semibold">{{.Error}}</span>
    </div>
    {{end}}

    <!-- Card Container -->
    <div class="glass-panel rounded-2xl border border-[#E5E3D8] dark:border-neutral-800 shadow-xl overflow-hidden">
        <div class="border-b border-[#E5E3D8] dark:border-neutral-800 bg-[#F4F1E4]/60 dark:bg-neutral-900/60 py-3 px-6 text-center">
            <h2 class="font-display font-bold text-xs uppercase tracking-wider text-slate-800 dark:text-slate-200">
                Choose New Credentials
            </h2>
        </div>

        <div class="p-6 sm:p-8">
            <form id="form-reset-password" action="/reset-password" method="POST" class="space-y-4 no-uppercase" data-no-uppercase="true">
                <input type="hidden" name="token" value="{{.Token}}">

                <div>
                    <label for="new_password" class="form-label mb-1.5">
                        New Password
                    </label>
                    <input type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password"
                           placeholder="•••••••••••• (min 6 characters)"
                           class="form-input py-2.5 px-4 text-sm">
                </div>

                <div>
                    <label for="confirm_password" class="form-label mb-1.5">
                        Confirm New Password
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password"
                           placeholder="Repeat your new password"
                           class="form-input py-2.5 px-4 text-sm">
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full flex items-center justify-center gap-2">
                    <span>Save Password &amp; Sign In</span>
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>

                <div class="text-center pt-2">
                    <a href="/login" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-black dark:text-slate-400 dark:hover:text-white transition">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        <span>Cancel and return to Sign In</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
